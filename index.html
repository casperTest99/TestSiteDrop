<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click Counter</title>
  <meta name="sitedrop-verification" content="sd_2040df10f39946a3b772f4d5495e8267">
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #FFD23F; }
    button { font-size: 2rem; padding: 1rem 2rem; border-radius: 1rem; border: 0; cursor: pointer; }
  </style>
</head>
<body>
  <main style="text-align:center">
    <h1>Click Counter</h1>
    <p id="count" style="font-size:4rem;margin:0">0</p>
    <button onclick="document.getElementById('count').textContent++">Click me</button>
  </main>
</body>
</html>
